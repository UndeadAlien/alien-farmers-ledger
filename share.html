<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="robots" content="noindex">
<title>Alien Farmers Build</title>
<meta name="description" content="A lot plan made with the Alien Farmers Ledger: the lot in 3D, the build list in order, and a build sheet to keep open next to Upland.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090f'/%3E%3Cellipse cx='32' cy='24' rx='9' ry='8' fill='%23bfe9ff'/%3E%3Cellipse cx='32' cy='31' rx='20' ry='6' fill='%23d7e2e8'/%3E%3Cpath d='M22 40l-6 14M42 40l6 14' stroke='%235ee38f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#07090f; --surface:#0d131d; --raised:#131b28; --sunk:#0a0f17; --line:#1b2534; --line-2:#2a3850;
  --ink:#e9eef5; --muted:#8c9bb1; --dim:#5f6e84;
  --leaf-rgb:94,227,143; --leaf:#5ee38f; --leaf-ink:#04210f; --leaf-soft:rgba(var(--leaf-rgb),.12);
  --daisy:#f6b552; --hot:#ff8466; --sky:#7cc4ff; --bad:#ff7070;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:800 15px var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand span{display:block;font:500 11px var(--mono);color:var(--leaf);letter-spacing:.12em;text-transform:uppercase}
header .t{margin-left:auto;text-align:right;min-width:0}
header h1{font:700 18px/1.15 var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;min-height:60vh;background:#0b1220}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(7,9,15,.82)}
.over[hidden]{display:none}
.over .box{max-width:420px}
.over h2{font:700 20px var(--display);margin:0 0 6px}
.over p{color:var(--muted);margin:0}
.bar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:rgba(13,19,29,.9);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--leaf)}
.btn[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.go{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn:disabled{opacity:.5;cursor:default}
aside{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px}
aside h2{font:700 16px var(--display);margin:0 0 4px}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li button{display:flex;gap:10px;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
ol.steps li button:hover,ol.steps li button.on{border-color:var(--leaf)}
ol.steps .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);color:#07090f}
.k-add{background:var(--leaf)} .k-move{background:var(--daisy)} .k-pick{background:var(--bad)}
ol.steps b{display:block;font-weight:600}
ol.steps span{font-size:13px;color:var(--muted)}
.need{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);font-size:14px}
.need b{display:block;margin-bottom:4px}
.dl{width:100%;margin:4px 0 12px;padding:12px}
footer{padding:10px 16px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:860px){
  html,body{height:auto}
  main{grid-template-columns:1fr;grid-template-rows:58vh auto;flex:none}
  .stage{min-height:0}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  header{padding:10px 12px}
  .brand b{white-space:nowrap;font-size:13px}
  .brand svg{width:28px;height:28px}
  header .t{max-width:52vw}
  header h1{font-size:16px}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="./" title="Alien Farmers">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0d131d"/><ellipse cx="32" cy="24" rx="9" ry="8" fill="#bfe9ff"/><ellipse cx="32" cy="31" rx="20" ry="6" fill="#d7e2e8"/><path d="M22 40l-6 14M42 40l6 14" stroke="#5ee38f" stroke-width="3" stroke-linecap="round"/></svg>
    <div><b>Alien Farmers</b><span>Build plan</span></div>
  </a>
  <div class="t"><h1 id="title">Loading the build…</h1><div class="sub" id="sub"></div></div>
</header>
<main>
  <div class="stage">
    <canvas id="cv" tabindex="0" aria-label="The lot in 3D"></canvas>
    <div class="over" id="over"><div class="box"><h2 id="overH">Loading the build…</h2><p id="overP">Reading the plan.</p></div></div>
    <div class="bar" id="bar" hidden>
      <button class="btn" type="button" id="bTop" aria-pressed="false">Top view</button>
      <button class="btn" type="button" id="bNums" aria-pressed="true">Numbers</button>
      <button class="btn" type="button" id="bReset">Reset view</button>
    </div>
  </div>
  <aside>
    <h2>Build list</h2>
    <div class="note">Do these in Upland, in order. Each item snaps to one placed before it.</div>
    <div class="legend"><span><i class="k-add"></i>place</span><span><i class="k-move"></i>move</span><span><i class="k-pick"></i>pick up</span></div>
    <button class="btn go dl" type="button" id="bSheet" disabled>Download build sheet</button>
    <ol class="steps" id="steps"></ol>
    <div class="need" id="need" hidden></div>
  </aside>
</main>
<footer><span>Made with the Alien Farmers Ledger. Lot and models from Upland's public map.</span><span id="when"></span></footer>
<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
const ST = "https://static.upland.me/";
const fail = (h, p) => { $("over").hidden = false; $("overH").textContent = h; $("overP").textContent = p; $("title").textContent = "Alien Farmers build"; };

const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const helper = (q.get("h") || "").replace(/\/+$/, ""), id = q.get("s") || "";
let P = null, v = null, mod = null, numsOn = true, topOn = false;

async function main(){
  if (!/^https:\/\/[\w.\-]+(:\d+)?$/.test(helper) && !/^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(helper) || !/^[a-z0-9]{6,16}$/.test(id)) return fail("This link isn't complete", "Ask for the share link again.");
  try { const r = await fetch(`${helper}/s/${id}`); const j = await r.json().catch(() => ({})); if (!r.ok) return fail("This build isn't shared any more", j.error || "The link was turned off."); P = j; }
  catch { return fail("Couldn't reach the build", "Check your connection and reload."); }
  if (!P || P.brand !== "Alien Farmers" || !P.lot || !P.design) return fail("This isn't an Alien Farmers build", "The link points somewhere else.");
  const L = P.lot;
  document.title = `${L.title} · ${P.design.name} · Alien Farmers`;
  $("title").textContent = L.title || "Lot plan";
  $("sub").textContent = [P.design.name, [L.addr, L.city].filter(Boolean).join(", ")].filter(Boolean).join(" · ");
  $("when").textContent = P.at ? "Shared " + new Date(P.at).toLocaleDateString([], {month: "short", day: "numeric", year: "numeric"}) : "";
  renderSteps();
  const gl = (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch { return false; } })();
  if (!gl) { fail("3D isn't available here", "This browser has WebGL turned off. The build list still works."); $("bSheet").disabled = true; return; }
  $("overH").textContent = "Building the lot…"; $("overP").textContent = "Loading Upland's 3D models.";
  mod = await import("./lot3d.js");
  const first = (() => { for (const p of P.props || []) for (const m of p.models || []) { const l = mod.lodOf(m, "hi"); if (l && l.url && l.url.startsWith(ST)) return l.url; } return null; })();
  let direct = true; if (first) { try { await fetch(first, {mode: "cors"}); } catch { direct = false; } }
  if (!direct) mod.setRewrite(u => u.startsWith(ST) ? `${helper}/pub/${u.slice(ST.length)}` : u);
  v = mod.createLotView($("cv"), {drag: "map", labels: true, shadows: true});
  try {
    await v.load({props: P.props, prop: L.prop, lat: L.lat, lng: L.lng}, {quality: "hi", neighbours: true, onProgress: (f, t) => { $("overP").textContent = `${t || "Loading"} · ${Math.round(f * 100)}%`; }});
  } catch (e) { return fail("Couldn't build the lot", String(e && e.message || e)); }
  await applyDesign();
  $("over").hidden = true; $("bar").hidden = false; $("bSheet").disabled = false;
  await v.intro();
}

const firstUrl = m => { const l = m && m.lods && (m.lods["0"] || m.lods[Object.keys(m.lods)[0]]); return String((l && (l.modelUrl || l.model)) || (m && m.model) || ""); };
const objs = new Map();
async function applyDesign(){
  const d = P.design, ed = v.editable();
  for (const o of ed) objs.set(o.userData.id, o);
  for (const [oid, sg] of Object.entries(d.stage || {})) { const o = objs.get(oid); if (!o) continue; const want = {...o.userData.m, lods: sg.lods, model: sg.model}; if (firstUrl(want) !== firstUrl(o.userData.m)) { try { objs.set(oid, await v.swapModel(o, want)); } catch {} } }
  for (const [oid, mv] of Object.entries(d.moves || {})) { const o = objs.get(oid); if (o) v.moveItem(o, mv.x, mv.z, mv.yaw); }
  for (const oid of Object.keys(d.removed || {})) { const o = objs.get(oid); if (o) o.visible = false; }
  await Promise.all((d.add || []).map(async a => { try { objs.set(a.id, await v.addItem(a.m, {x: a.x, z: a.z, yaw: a.yaw, id: a.id})); } catch {} }));
  for (const s of P.steps || []) { const o = objs.get(s.id); if (o) o.userData.name = s.name; }
  v.refresh(); labels();
}
function labels(){
  if (!v) return;
  v.setLabels(numsOn ? (P.steps || []).filter(s => s.kind !== "pick" && s.x != null).map(s => { const o = objs.get(s.id); return {x: s.x, z: s.z, y: Math.min(3, (o && o.userData.h) || 1), text: s.n, edge: s.kind === "move" ? "#f6b552" : "#5ee38f"}; }) : null);
}
function needs(){
  const c = new Map(); for (const s of P.steps || []) if (s.kind === "add") c.set(s.name, (c.get(s.name) || 0) + 1);
  return [...c].map(([name, count]) => ({name, count, wallet: null}));
}
function renderSteps(){
  const S = P.steps || [];
  $("steps").innerHTML = S.length ? S.map(s => `<li><button type="button" data-step="${esc(s.id)}"><span class="n k-${esc(s.kind)}">${esc(s.n)}</span><div><b>${esc(s.name)}</b><span>${esc(s.text)}</span></div></button></li>`).join("") : `<li class="note">No changes in this plan: it shows the lot as it is.</li>`;
  const N = needs(); $("need").hidden = !N.length;
  $("need").innerHTML = N.length ? `<b>You'll need</b>${N.map(n => `${n.count} × ${esc(n.name)}`).join(" · ")}` : "";
}
$("steps").addEventListener("click", e => {
  const b = e.target.closest("[data-step]"); if (!b || !v) return;
  document.querySelectorAll("[data-step].on").forEach(x => x.classList.remove("on")); b.classList.add("on");
  const o = objs.get(b.dataset.step); if (o && o.visible) v.focus(o);
});
$("bTop").addEventListener("click", () => { topOn = !topOn; $("bTop").setAttribute("aria-pressed", String(topOn)); v && v.planView(topOn); });
$("bNums").addEventListener("click", () => { numsOn = !numsOn; $("bNums").setAttribute("aria-pressed", String(numsOn)); labels(); });
$("bReset").addEventListener("click", () => { topOn = false; $("bTop").setAttribute("aria-pressed", "false"); v && v.reset(); });
$("bSheet").addEventListener("click", async () => {
  if (!v) return; const b = $("bSheet"); b.disabled = true; b.textContent = "Making the picture…";
  try {
    const hero = v.snapshot(1200, 700, "image/jpeg", .9, "hero");
    v.setLabels(null); const top = v.snapshotTop(1800, 1800); labels();
    const sheet = await import("./sheet.js");
    const cv = await sheet.makeSheet({top, hero, title: P.lot.title, sub: [P.lot.addr, P.lot.city].filter(Boolean).join(", "), design: P.design.name,
      made: new Date(P.at || Date.now()).toLocaleDateString([], {month: "short", day: "numeric", year: "numeric"}), ring: v.ring, needs: needs(),
      steps: (P.steps || []).map(s => ({n: s.n, kind: s.kind, name: s.name, text: s.text, x: s.x, z: s.z, bad: false}))});
    const slug = x => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    await sheet.saveCanvas(cv, `alien-farmers-build-${slug(P.lot.title) || "lot"}-${slug(P.design.name)}.png`);
  } catch (e) { alert("Couldn't make the picture: " + (e && e.message || e)); }
  finally { b.disabled = false; b.textContent = "Download build sheet"; }
});
main();
</script>
</body>
</html>
